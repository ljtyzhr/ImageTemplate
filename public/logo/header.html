<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>统一页头</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        .header {
            background: linear-gradient(90deg, #005bea 0%, #3ec6e0 100%);
            color: #fff;
            padding: 24px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .header-logo {
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .header-nav {
            display: flex;
            gap: 32px;
        }
        .header-nav a {
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            transition: opacity 0.2s;
            opacity: 0.85;
        }
        .header-nav a:hover {
            opacity: 1;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-logo">MyDollarSpace</div>
        <nav class="header-nav">
            <a href="#">首页</a>
            <a href="#">关于我们</a>
            <a href="#">联系我们</a>
        </nav>
    </header>
</body>
</html>
