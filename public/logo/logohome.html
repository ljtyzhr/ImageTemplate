<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>图片展示</title>
    <style>
        @import url("logo.css");
    </style>
    <script src="logo.js"></script>
</head>
<body>
    <div class="container">
        <div class="top-section">
            <img class="image-preview" src="../assets/logo-nba/atlanta_hawks_logo.png" alt="atlanta_hawks_logo">
            <div class="image-info">
                <div class="image-title">Atlanta Hawks Logo</div>
                <div class="image-meta">尺寸：600 x 400<br>格式：JPEG</div>
                <a class="download-btn" href="../assets/logo-nba/atlanta_hawks_logo.png" download>下载图片</a>
            </div>
        </div>
        <div class="bottom-section">
            <strong>图片说明：</strong>
            <p>这张图片展现了自然风光的宁静与美丽，远山与湖泊交相辉映，给人以心灵的平静。适合作为壁纸或自然主题的展示。</p>
            <strong>背景故事：</strong>
            <p>拍摄于清晨的湖畔，摄影师希望通过镜头捕捉大自然最纯净的瞬间，传递人与自然和谐共处的美好愿景。</p>
        </div>
    </div>
</body>
</html>
